# Campaign declare, schedule, raids, and war-goal tunables.
# Live battle engine (province poll, templates) stays in config.yml under battle:.
# Hours under battle_schedule are Europe/Paris (CET/CEST), not UTC.

war:
  # Production gate: an attacking leader can browse every war goal freely, but must type
  # a staff-minted Discord code to confirm the declaration. simplefactions.admin bypasses it.
  require_declare_code: true
  # How long to wait for ProvinceSystem to answer a code check before giving up. The
  # gate fails closed, so a slow backend blocks the declare rather than allowing it.
  declare_code_timeout_seconds: 10
  declare_opinion_threshold: -50
  initiative_factor: 1.5
  port_sea_zoc_radius: 2
  reparations:
    income_percent: 25
    days: 10
  truce:
    # Real days that factions on opposite sides of a finished war cannot declare on each other.
    days: 10
  history:
    # Sends war events (declared, joined, battle day, scheduled, postponed, battles, ended) and
    # finished battle records to the website's war pages, through TFMCWeb. Unsent items wait in
    # WarHistory/outbox.jsonl, so a website outage loses nothing. Off: nothing is recorded or sent.
    enabled: true
    # Applies the day and hour votes and the call to arms answers players make on the website's
    # war page or from a Discord DM. The website queues them; every five seconds the server fetches
    # them and checks each exactly as it checks the same click in game. Results of the last 1000 are
    # kept in WarHistory/actions-applied.json, so none is applied twice. Off: they wait on the website
    # (and expire there after ten minutes).
    actions_enabled: true
  goals:
    DE_JURE_ANNEX:
      max_battles_per_leg: 4
    SUBJUGATE:
      max_battles_per_leg: 4
    TRANSFER_SUBJECT:
      max_battles_per_leg: 4
    WAR:
      max_battles_per_leg: 4
    TRIBUTARY:
      max_battles_per_leg: 4
    USURP:
      max_battles_per_leg: 4
    OPEN_MARKET:
      max_battles_per_leg: 4
      defender_must_not_have: [free_trade]
      attacker_must_not_have: [isolationism]
      apply_defender_law: free_trade
    CHANGE_GOVERNMENT:
      max_battles_per_leg: 4
    PILLAGE:
      range_provinces: 3
      max_battles_per_leg: 1
      loot_days: 10
      trade_hit_percent: -100
      trade_hit_days: 10
    OVERTHROW:
      max_battles_per_leg: 4
    CHANGE_LAW:
      max_battles_per_leg: 4
    CHANGE_TAX:
      max_battles_per_leg: 4
    FORCE_PEACE:
      max_battles_per_leg: 4
    INDEPENDENCE:
      max_battles_per_leg: 4
    NATIONHOOD:
      max_battles_per_leg: 4
  civil_war:
    vassalage_group: vassalage
    vassalage_law: inclusive
  declined_ally_stability_penalty: -30
  # Declining a call from a coalition member costs more than declining an ally.
  declined_coalition_stability_penalty: -45
  # A call to arms stays open until the called leader answers or the war ends.
  battle_cadence:
    first_battle_at_border: true
    provinces_between_battles: 3
  occupation:
    include_enemy_neighbors: true
  pathfinder:
    neutral_penalty: 8.0
    sea_pass_enabled: true
    # water_cost: 0  # 0 = derive from terrain-modifiers WATER via 1/carry
  battle_schedule:
    # Installation picks lock, and the enemy's show, at this hour on the battle day.
    vote_close_hour: 16
    raid_window_start_hour: 19
    raid_window_end_hour: 20
    window_start_hour: 21
    # Last valid start hour is window_end_hour - 1. Values past 24 run past midnight:
    # 26 lets battles start up to 01:00 CET, and the battle day then ends at 02:00.
    # The availability menu shows at most 5 start hours.
    window_end_hour: 26
    # A post-battle choice nobody made is settled at this hour on the day after the battle.
    defender_choice_deadline_hour: 12
    one_battle_per_day: true
    # Only used when war.buildup is disabled: whether the declaration's own day can be a battle day.
    first_battle_day_after_declare: true
  # Players mark every date and start time they could fight. Each date is decided on its own:
  # day_lock_hours_before its battle window opens, it becomes a battle day when, at one start
  # time, min_per_side of each side marked it (or the whole side, if it has fewer active members;
  # hired mercenaries count for their hirer). Otherwise there is no battle that day. A battle day's
  # start time is fixed time_lock_hours_before: the time most of both sides can make. After
  # max_days_without_battle dates in a row without a battle, the last one is a battle day anyway
  # (0: never); if one side marked no time at all that day, its battle is autoresolved.
  availability:
    days_shown: 7
    day_lock_hours_before: 48
    time_lock_hours_before: 24
    min_per_side: 3
    max_days_without_battle: 3
    # In-game "[Vote on the website]" link; {war_key} is replaced. Empty: no link.
    vote_url: "https://www.tfminecraft.net/wars/{war_key}#vote"
  # A declared war waits before its first battle. Until that battle starts, every faction in it
  # is frozen: running regiment, installation, war-related guild upgrade, mercenary company and
  # VFBuilders timers pause, and none of those can be started, nor vehicles added to the faction
  # pool or a berth. Hiring mercenaries stays open. Civil wars split first, then wait the same way.
  buildup:
    enabled: true
    # No battle day before first_option_day days after the declaration's battle day, so players
    # mark a week ahead.
    first_option_day: 7
  notices:
    # Days a war notice for an offline character waits for its next login.
    keep_days: 14
  # Simulated battle when both leaders agree, or on a forced battle day one side never marked.
  autoresolve:
    # Each side's strength is multiplied by a uniform factor in [1 - luck, 1 + luck].
    luck: 0.15
    # Share of the losing side's lives removed. The beaten army retreats rather than being wiped out.
    loser_loss_fraction: 0.5
  devmode:
    phantom_count: 10
  # Every slot a force brings puts lives_per_regiment lives in its side's shared pool. When a
  # battle ends, the side's deaths become wounds: split between forces by the lives each brought,
  # militia first inside a force, then law and paid slots in proportion. Law slots are full again
  # after every battle. Every deaths_per_regiment_loss wounded lives make one paid slot wounded:
  # it brings no lives and costs no upkeep, and it is lost when the war ends. Mercenary companies
  # never lose slots; their wounds heal by mercenary_heal_percent of the company's slots every
  # mercenary_heal_hours.
  battle_military:
    lives_per_regiment: 5
    min_side_lives: 1
    deaths_per_regiment_loss: 5
    mercenary_heal_percent: 25
    mercenary_heal_hours: 6
  # One reward per player for every fighter still present when the battle
  # ended, win, lose, or draw. The per-battle toggle lives in the battle editor;
  # campaign raids ship with it off.
  battle_loot:
    # COMMAND dispatches every line below from console once per player.
    # ITEM gives a TLibs item instead.
    mode: ITEM
    # Both %player% and #player# are replaced with the player name.
    commands:
      # - "crates key give %player% battle_key 1"
    # Used when mode is ITEM. TLibs path: v.diamond, ia.namespace:id, m.type.id
    item: m.materials.ignitium
    item_amount: 4
  campaign_raid:
    muster_seconds: 60
    muster_reminder_seconds_before:
      - 45
      - 30
      - 15
      - 10
    duration_seconds: 600
    repair_lock_hours: 48
    intruder_damage_interval_ticks: 10
    intruder_damage_amount: 4
