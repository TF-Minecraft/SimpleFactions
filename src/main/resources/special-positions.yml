# Special offices and their intelligence network. Reload settings with /faction reloadconfigs.
# For testing: /faction reloadespionage reloads this file, rerolls daily checks and regenerates reports.
# Character aptitude rolls, appointment history and unrest are never reset by that command.
positions:
  spymaster:
    # Stability points lost whenever the office is vacant or its holder is ineligible.
    # Persists without decay until filled. Zero disables this penalty.
    vacancy-stability-penalty: 10.0
espionage:
  # Assign these nodes through LuckPerms; bypass only grants viewing access.
  bypass-permission: simplefactions.espionage.bypass
  reload-permission: simplefactions.espionage.reload
  appointments:
    # Appointments are free. Replacing an appointed Spymaster brings unrest that fades over penalty-days.
    # The automatic founding appointment does not count as a replacement.
    stability-penalty: 10.0
    penalty-days: 7.0
    # A newly appointed Spymaster starts at this share of their aptitude (0-1) and reaches
    # full aptitude after build-up-days. Zero days disables the build-up.
    build-up-days: 7.0
    starting-aptitude: 0.25
    # Days after an appointment before the leader can appoint another Spymaster. Removing one is
    # always allowed. A holder's character death waives the wait. Zero disables it.
    change-cooldown-days: 2.0
  # Each character rolls once for life. Attribute/formula changes affect only new characters.
  aptitude:
    base: 50.0
    attribute-center: 6
    attribute-cap: 16
    random-spread: 20
    # The faction leader holds every vacant office by default. Each office a character holds
    # beyond their first costs this fraction of their aptitude in all of them:
    # 1 office 100%, 2 offices 75%, 3 offices 50%... Never below 0%. Zero disables this penalty.
    extra-position-penalty: 0.25
    attribute-weights:
      intelligence: 3.0
      wisdom: 2.5
      charisma: 1.5
      dexterity: 1.0
      constitution: -2.0
      strength: -2.0
  checks:
    # Daily roll = aptitude * multiplier + averaged luck - private sabotage reduction.
    # Averaging three uniform draws makes extreme luck (and major upsets) rare but possible.
    aptitude-multiplier: 1.25
    luck-spread: 75
    luck-draws: 3
  vassalage:
    # Added to an overlord's margin when its network spies on a vassal (direct or further down).
    overlord-offense-bonus: 25
    # Taken from a vassal's margin when its network spies on any overlord above it.
    overlord-defense-bonus: 25
    # Lets each Spymaster share information with their overlord, their vassals and their allies, chosen by tier.
    # Every field visible at the shared tier or below then reaches that partner exactly instead of as a range.
    allow-sharing: true
  sabotage:
    # Roleplay text for the Spymaster's private sabotage. Only the Spymaster sees it, in Private
    # Conduct and in chat when they change a setting. Offensive sabotage weakens their own
    # faction's spying on others; defensive sabotage lets other factions' spies learn more.
    # Levels are the roll reduction (0 = off). Each has a name, lore lines and a chat message.
    # & colour codes and #rrggbb hex colours work. {reduction} is replaced with the level.
    note: "&8This affects your next daily rolls. Existing reports stay unchanged."
    footer:
      - "&7Click to cycle: off, -25, -50, -75, -100."
      - "&8A private choice for roleplay betrayal."
    offense:
      title: "Offensive sabotage"
      lore:
        - "&7Undermines your own faction's spying"
        - "&7on other factions."
      levels:
        "0":
          name: "&aFaithful service"
          lore:
            - "&7Your agents abroad follow honest orders,"
            - "&7and all they learn reaches your leader."
            - "&8Spying roll: no penalty"
          message: "&7You send your agents abroad with honest orders. Whatever they learn, your leader will learn too. &8(Offensive sabotage off.)"
        "25":
          name: "&eStray dispatches"
          lore:
            - "&7You let the odd dispatch go astray"
            - "&7and leave a few promising leads unfollowed."
            - "&cSpying roll: -{reduction}"
          message: "&7You begin letting the odd dispatch go astray. Your leader will hear a little less of foreign courts. &8(Spying roll -{reduction}.)"
        "50":
          name: "&6Idle informants"
          lore:
            - "&7You pay your informants late and"
            - "&7send them after the wrong secrets."
            - "&cSpying roll: -{reduction}"
          message: "&7You pay your informants late and point them at the wrong doors. Reports from abroad will come back thin and vague. &8(Spying roll -{reduction}.)"
        "75":
          name: "&cDoctored reports"
          lore:
            - "&7You rewrite your agents' letters before"
            - "&7your leader reads them, blurring figures"
            - "&7and dropping names."
            - "&cSpying roll: -{reduction}"
          message: "&7You take up the pen yourself and blur every figure before your leader sees it. Foreign courts will seem murkier than they are. &8(Spying roll -{reduction}.)"
        "100":
          name: "&4Blinding your masters"
          lore:
            - "&7You recall your best agents and feed"
            - "&7your leader little but rumour."
            - "&cSpying roll: -{reduction}"
          message: "&7You quietly recall your best agents. Your leader will see rivals only through rumour, and only you know why. &8(Spying roll -{reduction}.)"
    defense:
      title: "Defensive sabotage"
      lore:
        - "&7Undermines your own faction's guard"
        - "&7against other factions' spies."
      levels:
        "0":
          name: "&aVigilant watch"
          lore:
            - "&7Your counter-agents guard the archives"
            - "&7and turn foreign spies away at the gate."
            - "&8Guarding roll: no penalty"
          message: "&7You set your counter-agents to watch the archives and the gates. Foreign spies will find little to take. &8(Defensive sabotage off.)"
        "25":
          name: "&eLoose lips"
          lore:
            - "&7You let gossip run unchecked"
            - "&7in taverns and halls."
            - "&cGuarding roll: -{reduction}"
          message: "&7You stop hushing the gossip in taverns and halls. Foreign spies will overhear a little more than they should. &8(Guarding roll -{reduction}.)"
        "50":
          name: "&6Unguarded doors"
          lore:
            - "&7You pull the watch from the archives"
            - "&7and look away from strangers at court."
            - "&cGuarding roll: -{reduction}"
          message: "&7You pull the watch from the archives and look the other way at court. Rival networks will learn far more than they should. &8(Guarding roll -{reduction}.)"
        "75":
          name: "&cForeign silver"
          lore:
            - "&7You take foreign coin and steer"
            - "&7rival agents to the right ledgers."
            - "&cGuarding roll: -{reduction}"
          message: "&7You pocket foreign silver and steer rival agents toward the right ledgers. Your faction's secrets will drain away. &8(Guarding roll -{reduction}.)"
        "100":
          name: "&4Opening the vaults"
          lore:
            - "&7You hand rival spymasters the keys"
            - "&7to the archive. Almost nothing stays hidden."
            - "&cGuarding roll: -{reduction}"
          message: "&7You hand rival spymasters the keys to the archive. Little about your faction stays hidden, and no one suspects whose hand opened the doors. &8(Guarding roll -{reduction}.)"
  intelligence:
    # true: the Spymaster guards only the military view (regiments, training, vehicle pool) and the
    # vehicles berthed at installations, plus the military, vehicle and mercenary ledger lines. Everything else,
    # including members, economy, laws, government, installations and offices, is exact for everyone.
    # false: the Spymaster guards everything.
    military-only: true
    # Margin = observing faction's offense minus target's defense. Rumours is the minimum report quality.
    # Negative margins return Rumours; individual fields stay Unknown below their required tier.
    tiers:
      rumours:
        minimum-margin: 0
        uncertainty: 1.5
        roster-fraction: 0.2
        maximum-bounded-fraction: 0.75
        maximum-relative-width: 4.0
      broad:
        minimum-margin: 30
        uncertainty: 0.75
        roster-fraction: 0.4
        maximum-bounded-fraction: 0.65
        maximum-relative-width: 3.0
      reliable:
        minimum-margin: 65
        uncertainty: 0.2
        roster-fraction: 0.6
        maximum-bounded-fraction: 0.5
        maximum-relative-width: 2.0
      detailed:
        minimum-margin: 100
        uncertainty: 0.1
        roster-fraction: 0.8
        maximum-bounded-fraction: 0.5
        maximum-relative-width: 2.0
    maximum-roster-size: 23
    # Fields stay Unknown below their minimum tier, even if an old report contains an estimate.
    # Valid values: rumours, broad, reliable, detailed. Unknown disables disclosure entirely.
    # The faction and all its guilds share one daily quality. Flavours, faction leaders, guilds and prestige stay public.
    # With military-only, only the military fields are used: army, vehicles, professional-army, levies,
    # mercenaries, vehicle-categories, training, berthed-vehicles, vehicle-types, plus cashflow for the
    # military, vehicle and mercenary ledger lines. Everything else is public.
    minimum-tiers:
      members: rumours
      roster: rumours
      wealth: rumours
      prosperity: broad
      stability: broad
      administrative-power: reliable
      # Army is professional soldiers, levies and mercenaries together; vehicles are the pool plus berths.
      army: rumours
      vehicles: rumours
      professional-army: broad
      levies: broad
      mercenaries: broad
      # Owned vehicles per category, per installation berth, and which vehicle types they are.
      vehicle-categories: broad
      berthed-vehicles: reliable
      vehicle-types: detailed
      installations: broad
      net-income: broad
      trade-power: broad
      income-total: broad
      expense-total: broad
      cashflow: reliable
      dividend-rate: reliable
      dividend-pool: reliable
      dividend-tax: reliable
      dividend-per-member: reliable
      office-holder: reliable
      office-aptitude: detailed
      guild-leader: reliable
      guild-members: rumours
      training: reliable
      buildings: broad
      upgrades: reliable
      taxes: reliable
      laws: reliable
      government: reliable
      installation-details: reliable
      # Optional per-category overrides, e.g. TRADE: broad. All other categories use cashflow above.
      cashflows: {}
