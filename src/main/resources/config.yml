# SimpleFactions — map-reference: main (world: TFMC_Map)
# world-name must match the loaded Bukkit overworld (server.properties level-name).

world-name: TFMC_Map

# Legitimacy, the weak state, and the status brackets. Restart or reload after edits.
stability:
  legitimacy-election: 70
  legitimacy-community: 80
  legitimacy-council: 35
  legitimacy-autocracy: 10
  neutral-weight: 0.35
  illegitimate-below: 50
  movement-gain-multiplier: 2
  community-free-provinces: 10
  community-province-cost: 2
  # Share of the largest other guild the state must match.
  weak-state-autocracy: 1.0
  weak-state-oligarchy: 0.5
  weak-state-plutocracy: 0
  weak-state-community: 0
  weak-state-democracy: 0.2
  elected-weak-state-factor: 0.5
  # Extra trade power foreign guilds have in this nation's provinces at 0 stability.
  foreign-trade-max: 0.5
  # Admin, diplomacy, upkeep, de jure, and prestige reach their floor this many points below 100.
  slow-debuff-span: 80
  slow-admin-loss: 0.5
  slow-upkeep-gain: 1.0
  slow-de-jure-max: 30
  slow-prestige-max: 25

# When true, debug sessions are appended to plugins/SimpleFactions/logs/log.txt
# and relation events are appended to plugins/SimpleFactions/logs/relations.log
# Movement / civil war / war events go to movement.log, civilwar.log, war.log
logging: true
# When true, all files in plugins/SimpleFactions/logs/ are deleted on every plugin start/reload
wipe-log: true

max-prestige-from-wealth: 800 # shared between factions based on % of global wealth
# Prestige from the faction's own guilds' trade power (not vassals).
# 2.0 means 1 trade power is 2 prestige. 0 disables the Trade line.
prestige-per-trade-power: 2.0
# Linear until this much Trade prestige, then the next points keep paying
# but the rate decays toward prestige-from-trade-falloff over each further
# cap-sized band. 0.1 means very slow growth past ~2000. 1.0 is no falloff.
prestige-from-trade-soft-cap: 2000
prestige-from-trade-falloff: 0.1
# Each member adds 2^(online hours / 100) to the Members prestige term, so 100 h
# doubles their share and this cap ends the curve. 5 means a member is worth at
# most 32, reached at 500 h. Needs RPCharacters; without it the term is 0.
max-prestige-playtime-exponent: 5
max-members: 64
max-untitled-provinces: 5
max-free-titles: 3
province-cost: 50
# Charged to the faction bank when a leader moves or renames the capital with
# /faction setcapital. A faction's first move or rename is free.
capital-move-cost: 100.0
# Anti payday-joining: a member only receives a dividend share if they were
# already in the guild at the previous daily tick. The percentage itself is not
# a config key; each guild leader sets it, starting at 0%.
dividend-require-previous-tick-membership: true

# Mercenary companies.
# One-off charge taken from the host guild when the charter is requested.
mercenary-formation-cost: 100.0
# Founding time. The faction timer ticks once per real second, so 86400 is 24 h
# of real time, not a campaign day. The company arrives with 1 slot.
mercenary-formation-seconds: 86400
# Denars per slot per day, paid by the host guild, not by or to the soldier.
# Charged for every slot the company owns, filled or not, contracted or not.
mercenary-slot-upkeep: 8.0
# Contract floors. A company sets its own prices but may not go below these.
# A battle day costs the day price AND the battle price, not either/or.
mercenary-min-price-per-battle: 50.0
mercenary-min-price-per-day: 10.0
mercenary-max-contract-days: 14
# Pre-filled into a new contract; the real figure lives on the contract itself.
mercenary-default-breach-refund: 500.0

# Not configurable: the absence refund per slot per battle must be at least
# mercenary-min-price-per-battle, validated when the contract is created. A
# smaller refund would make no-showing more profitable per head than fighting.

supply-hubs:
  # Dev servers only. When true, the player who sends hub terms also accepts them,
  # so one person can finish an agreement. Leave this false on a live server.
  auto-accept: false
  # Highest hub tax percent an agreement may set. The host's economy law can set a lower cap.
  max-tax: 50
  # Highest daily fee, in denars, an agreement may set.
  max-fee: 500
  # Days an offer stays open after the last move.
  offer-days: 7
  # Days a hub agreement runs.
  agreement-days: 14
  # Strength of sea and rail corridor provinces as boarding and arrival stops.
  # Air has no corridor stops. 1 makes a corridor stop as strong as an installation.
  corridor-share: 0.5
  # A stop delivers a share of the guild's trade there to the next stop.
  #   trade / production: share delivered before distance loss (capped at 0.95)
  #   kept-per-1000-blocks: share that survives each 1000 blocks
  # Rail length is the track route. Sea and air are a straight line.
  transport:
    rail:
      trade: 0.40
      production: 0.80
      kept-per-1000-blocks: 0.90
    sea:
      trade: 0.30
      production: 0.70
      kept-per-1000-blocks: 0.85
    air:
      trade: 0.20
      production: 0.50
      kept-per-1000-blocks: 0.80

bank-block: iaf(tfmc:bank)
voting-block: iaf(tfmc:voting_booth)
starting-year: "372 AE"

max-extra-node-capacity: 0
de-jure-requirement: 75.0
# Days after a law group changes before the faction can switch it again.
# Coups, movements, war outcomes and admin commands ignore it. 0 disables it.
law-switch-lock-days: 3

# Map platform (step 42) — requires TFMCWeb softdepend + api.base-url configured
enable-map: true
# When false, skip Input/ province grid load; land, war, and map systems are off.
# Also forces enable-map to false.
enable-provinces: true
# Daily wealth/prestige snapshot uploaded to ProvinceSystem for season graphs.
# Independent of enable-map so a broken chronicle never blocks a map regen.
enable-chronicle: true
# Live upload socket (URL folder). Season archive uses map-id / map-name, not this.
map-reference: main
# Chapter slug (alphanumeric). Prefills a future Archive; not the live folder.
map-id: unknown
# Display name for that chapter. Blank becomes Unknown; not derived from map-id.
map-name: Unknown
# Members of guilds whose capital is in the settlement. More than this uses the large map icon.
settlement-large-population-threshold: 8
port-sea-proximity-blocks: 20

battle:
  province_poll_interval_ticks: 20
  province_leave_countdown_seconds: 10
  province_block_protection_enabled: false
  capture_min_players: 1
  item_durability_multiplier: 0.2
  retreat_min_elapsed_seconds: 1200
  signup_reminder_seconds_before:
    - 1800
    - 600
    - 300
    - 60
  siege:
    contest_duration_seconds: 180
  raid:
    defender_respawn_mode_default: INFINITE
  campaign_template:
    field: field_default
    siege: siege_default
    raid: campaign_raid_template
  # A side with nobody online is eliminated only after this many seconds
  # empty, from the battle start or from when its last player left.
  empty_side_grace_seconds: 300
  # Ends campaign field and siege battles after this long. The side with more lives left wins,
  # equal lives is a draw. Off until the server decides to enforce it.
  time_cap_enabled: false
  time_cap_minutes: 120

# A province's prosperity is unchanged up to prosperity-soft-cap. Past it the
# excess grows with a square root, so each point is worth less: half at
# cap + 3 x scale, a third at cap + 8 x scale. No ceiling. 0 disables it.
prosperity-soft-cap: 80
prosperity-soft-cap-scale: 20
# Most of a province's trade income a guild can pay as trade upkeep, so it
# always keeps the rest. 0.75 keeps at least a quarter. 0 disables the limit.
max-trade-upkeep: 0.75

branch-upgrade-cost: 100.0
branch-upgrade-exponent: 1.07
# Administrative power to elevate a guild: elevation-base + (size × elevation-size-multiplier) ^ elevation-exponent.
# Size is the sum of that guild's branch levels. Eviction costs eviction-multiplier times the elevation cost.
elevation-base: 25.0
elevation-size-multiplier: 1.0
elevation-exponent: 1.1
eviction-multiplier: 2.0

# Infrastructure closes the gap from raw land terrain to target at full strength.
infrastructure:
    full: 20
    target: 0.75
    wilderness-spread: 0.25
    spread-floor: 0.5
    station: 10
    port: 10
    airport: 5
    track: 10
    track-refresh-seconds: 300

terrain-modifiers:
    - FARMLAND 0.95
    - PLAINS 0.85
    - HILLS 0.5
    - FOREST 0.6
    - HIGHLANDS 0.55
    - JUNGLE 0.45
    - WATER 0.75
    - SEA 0.6
    - BOG 0.4
    - MOUNTAIN 0.3
    - DRYLANDS 0.6

icons:
    - diplomacy(black_dye.5)
    - overlord(black_dye.3)
    - subject(black_dye.4)
    - integrated_subject(black_dye.4)
    - rival(black_dye.6)
    - tributary(black_dye.7)
    - suzerain(black_dye.8)
    - ally(black_dye.9)
    - war(black_dye.10)
    - friendly(black_dye.11)
    - neutral(black_dye.2)
    - unfriendly(black_dye.13)
    - hostile(black_dye.14)
    - march(black_dye.15)
    - installations(black_dye.15)
    - palatinate(black_dye.16)
    - mercantile(black_dye.17)
    - tier(black_dye.18)
    - titles(black_dye.19)
    - county(black_dye.20)
    - duchy(black_dye.21)
    - kingdom(black_dye.22)
    - empire(black_dye.23)
    - independence(black_dye.5)
    - usurp(black_dye.3)
    - stability(black_dye.2)
    - loans_given(black_dye.7)
    - loans_taken(black_dye.8)
    - guild_elevate(black_dye.4)
    - guild_loans(black_dye.17)
    - muster(black_dye.11)

base-effects:
  favoured_guilds:
    modifiers:
      - stability_influence(10)
    our_territory:
      - trade_power(20)
  repressed_guilds:
    modifiers:
      - stability_influence(-25)
    our_territory:
      - trade_power(-15)
  favoured_vassals:
    modifiers:
      - stability_influence(10)
      - tax_multiplier(-5)
    our_territory:
      - trade_power(15)
  repressed_vassals:
    modifiers:
      - stability_influence(-15)
      - tax_multiplier(5)
    our_territory:
      - trade_power(-10)
