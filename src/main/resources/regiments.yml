# Prototype for mercenary company slots. The mercenary: true flag keeps this
# type out of every faction military; only a company clones it. Full reference:
# docs/mercenaries.md
mercenary:
    name: "#b7aae3Mercenary Company"
    mercenary: true
    default-slots: 0
    # Charged per slot per day to the host guild. Kept in step with
    # mercenary-slot-upkeep in config.yml, which is what the ledger reads.
    upkeep: 8.0
    # Slot expansion time in real seconds (24 h). A company cannot start a new
    # expansion while it already has one unfilled slot.
    expansion-time: 86400
    levy: false
    offense: true
    item:
        material: BLACK_DYE
        model-data: 11
    description:
        - "#b7aae3Mercenaries #a89977are guild soldiers for hire"
        - "#a89977they answer to their company, not to a realm"
        - "#a89977and only fight where their contract sends them"
