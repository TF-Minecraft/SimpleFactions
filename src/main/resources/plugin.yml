main: net.tfminecraft.simplefactions.SimpleFactions
api-version: '1.21.10'
name: SimpleFactions
version: ${project.version}
author: Drefvelin

depend: [DenarEconomy, TLibs]
softdepend: [MMOItems, MythicLib, MMOCore, MythicMobs, TFMCWeb, VehicleFramework, VFBuilders, ConditionalEvents, RPCharacters, ItemsAdder]

permissions:
  simplefactions.espionage.bypass:
    description: View exact faction and guild information through the original menus and rankings.
    default: false

  simplefactions.espionage.reload:
    description: Reload office settings and regenerate all daily intelligence reports for testing.
    default: false

  simplefactions.taxexempt:
    description: Owe no citizen tax on any character while held. Grant it to the on-duty staff and helper groups, so NPC and lore characters keep the denars they are given.
    default: false

commands:
  faction:
      usage: /<command>
      description: Faction Command
  guild:
      usage: /<command>
      description: Guild Command
  warband:
      usage: /<command>
      description: Warband Command
  battle:
      usage: /<command>
      description: Battle Command
  raid:
      usage: /<command>
      description: Campaign raid command
  war:
      usage: /<command>
      description: War command
  movement:
      usage: /<command>
      description: Movement admin command
  ledger:
      usage: /<command>
      description: View your daily cashflow ledger
  company:
      usage: /<command>
      description: Mercenary company command
  mercenaries:
      usage: /<command>
      description: Browse and hire mercenary companies
  coalition:
      usage: /<command>
      description: Form, join and run coalitions against a common target
