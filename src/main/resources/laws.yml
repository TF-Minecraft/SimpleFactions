      upkeep: 0
      compatibility:
        - low 1
        - medium 2
        - high 3
      effects:
        faction:
          rules:
            - citizen_tax false
    low:
      name: "#7bc767Low"
      description:
        - "#7bc767Low taxes #d4c9aereduce burden"
        - "#d4c9aeon citizens while generating"
        - "#d4c9aea modest income."
      cost: 15
      upkeep: 2
      compatibility:
        - none 1
        - medium 1
        - high 2
      effects:
        faction:
          brackets:
            citizen_tax: "5-10"
    medium:
      name: "#bfc267Medium"
      description:
        - "#bfc267Moderate taxes #d4c9aestrike"
        - "#d4c9aea balance between income and"
        - "#d4c9aecitizen satisfaction."
