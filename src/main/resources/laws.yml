      upkeep: 6
      compatibility:
        - autocracy 1
        - plutocracy 1
        - democracy 2
        - community 2
      effects:
        faction:
          rules:
            - has_council true
            - appointed_council true
    plutocracy:
      name: "#cf67b5Plutocracy"
      description:
        - "#cf67b5Plutocratic rule #d4c9aefavors"
        - "#d4c9aewealth and economic influence."
        - "#d4c9aeThe richest guilds/vassals will be"
        - "#d4c9aegranted representation on the council."
