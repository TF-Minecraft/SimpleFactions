          rules:
            - has_council true
            - wealth_based_council true
    democracy:
      name: "#677ecfDemocracy"
      description:
        - "#677ecfDemocratic rule #d4c9aegives"
        - "#d4c9aepower to the populace. The council"
        - "#d4c9aeis populated by elections."
      cost: 50
      upkeep: 8
      compatibility:
        - oligarchy 2
        - plutocracy 2
        - autocracy 3
        - community 3
      effects:
