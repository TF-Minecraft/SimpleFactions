          rules:
            - has_council false
    autocracy:
      name: "#85828fAutocracy"
      description:
        - "#85828fAutocratic rule #d4c9aecentralizes"
        - "#d4c9aepower in a single leader. No council"
        - "#d4c9aeexists, and all decisions rest entirely"
        - "#d4c9aewith the leader."
