citizen_tax:
  name: "#c9c99bCitizen Tax"
  description:
    - "#c9c99bCitizen taxes #d4c9aeare collected"
    - "#d4c9aefrom the general population and"
    - "#d4c9aeprovide the core income of the"
    - "#d4c9aefaction treasury."
