      upkeep: 4
      compatibility:
        - none 2
        - low 1
        - high 1
      effects:
        faction:
          brackets:
            citizen_tax: "10-25"
    high:
      name: "#d1775eHigh"
      description:
        - "#d1775eHeavy taxation #d4c9aegenerates"
        - "#d4c9aesubstantial income at the cost"
        - "#d4c9aeof public support."
