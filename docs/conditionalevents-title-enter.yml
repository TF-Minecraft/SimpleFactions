# Copy into ConditionalEvents (type: custom). SimpleFactions softdepends ConditionalEvents.
# Title events fire only when that title id changes, not on every province hop inside the same title.

sf_province_enter:
  type: custom
  custom_event_data:
    event: me.Plugins.SimpleFactions.Events.PlayerProvinceEnterEvent
    player_variable: getPlayer()
    variables_to_capture:
    - '%province_id%;getProvinceId()'
    - '%previous_province_id%;getPreviousProvinceId()'
  conditions:
  - '%province_id% equals 42'
  actions:
    default:
    - 'message: &eYou entered province %province_id%'

sf_title_enter:
  type: custom
  custom_event_data:
    event: me.Plugins.SimpleFactions.Events.PlayerTitleEnterEvent
    player_variable: getPlayer()
    variables_to_capture:
    - '%tier%;getTierId()'
    - '%title_id%;getTitleId()'
    - '%title_name%;getTitleName()'
    - '%previous_title_id%;getPreviousTitleId()'
  conditions:
  - '%tier% equals county'
  - '%title_id% equals osheim'
  actions:
    default:
    - 'message: &eYou entered %title_name%'

sf_title_leave:
  type: custom
  custom_event_data:
    event: me.Plugins.SimpleFactions.Events.PlayerTitleLeaveEvent
    player_variable: getPlayer()
    variables_to_capture:
    - '%tier%;getTierId()'
    - '%title_id%;getTitleId()'
    - '%next_title_id%;getNextTitleId()'
  conditions:
  - '%tier% equals kingdom'
  actions:
    default:
    - 'message: &7You left kingdom %title_id%'

# getTierId() is one of: county, duchy, kingdom, empire

# Gameplay map regions (Input/regions.json), not WorldGuard and not title tiers.
# Fires only when the region id changes, not on every province hop inside it.

sf_region_enter:
  type: custom
  custom_event_data:
    event: me.Plugins.SimpleFactions.Events.PlayerEnterRegionEvent
    player_variable: getPlayer()
    variables_to_capture:
    - '%region_id%;getRegionId()'
    - '%region_name%;getRegionName()'
    - '%previous_region_id%;getPreviousRegionId()'
  conditions:
  - '%region_id% equals REGION_1'
  actions:
    default:
    - 'message: &eYou entered %region_name%'

sf_region_leave:
  type: custom
  custom_event_data:
    event: me.Plugins.SimpleFactions.Events.PlayerLeaveRegionEvent
    player_variable: getPlayer()
    variables_to_capture:
    - '%region_id%;getRegionId()'
    - '%next_region_id%;getNextRegionId()'
  actions:
    default:
    - 'message: &7You left %region_id%'

